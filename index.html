*, *::before, *::after { box-sizing: border-box; }

html { font-size: 100%; -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-color: #ffffff;
  color: #ffffff;
  font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.65;
  overflow-x: hidden;
}

img { max-width: 100%; height: auto; border: 0; display: inline-block; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.emoji {
  display: inline !important;
  height: 1em; width: 1em;
  margin: 0 .07em;
  vertical-align: -0.1em;
  background: none;
}

/* ---------- Layout ---------- */
.container {
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
}
.container--narrow { max-width: 525px; }

.section--top > .container { max-width: 1600px; }

.section--top {
  background-image: linear-gradient(180deg, #2A7924 7%, #000000 77%);
  padding: 40px;
}

.section--main { background-color: #000000; }

.section--bottom {
  background-image: linear-gradient(180deg, #000000 49%, #2A7924 84%);
  padding: 82px;
  margin: 0;
}

.main-grid { align-items: flex-start; }

.col { min-height: 1px; display: flex; flex-direction: column; }
.col--text  { width: 48.034%; padding: 0 10px; }
.col--image { width: 51.919%; padding: 0 10px; background-color: #000000; }

.hero-title, .hero-text, .spacer, .logo-wrap { margin-bottom: 20px; }

.spacer { width: 100%; }
.spacer-50 { height: 50px; }
.spacer-40 { height: 40px; }
.spacer-10 { height: 10px; }

/* ---------- Conteúdo ---------- */
.hero-title {
  margin: 0 0 20px;
  text-align: start;
  font-family: "Boogaloo", Sans-serif;
  font-size: 40px;
  font-weight: 700;
  line-height: 1.3em;
  color: #FFFFFF;
}
.hero-title__accent { color: #0bef0d; }

.hero-text {
  font-family: "Roboto", Sans-serif;
  font-weight: 500;
  font-size: 18px;
  color: #FFFEFE;
}
.hero-text p { margin: 0; }

.btn-wrap {
  text-align: left;
  margin: -10px 67px 20px 0;
  padding: 0 14px 0 0;
}

.btn {
  display: inline-block;
  text-decoration: none;
  background-color: #09E80C;
  color: #000000;
  fill: #000000;
  font-family: "Poppins", Sans-serif;
  font-size: 16px;
  font-weight: 900;
  line-height: 19px;
  letter-spacing: 0px;
  word-spacing: 2px;
  text-align: center;
  text-shadow: 0 0 10px rgba(0,0,0,.3);
  box-shadow: 0 0 10px 0 #0EFF00;
  border-radius: 16px;
  padding: 8px 120px;
  transition: background-color .3s, transform .2s;
}
.btn:hover { background-color: #0bff10; }
.btn:active { transform: scale(.98); }

/* Animação "shake" (Elementor) */
.animated { animation-duration: 1.25s; animation-fill-mode: both; }
.shake { animation-name: shake; animation-iteration-count: 1; }
@keyframes shake {
  from, to { transform: translate3d(0,0,0); }
  10%, 30%, 50%, 70%, 90% { transform: translate3d(-10px,0,0); }
  20%, 40%, 60%, 80% { transform: translate3d(10px,0,0); }
}
@media (prefers-reduced-motion: reduce) {
  .animated { animation: none; }
}

.logo-wrap {
  margin: 31px 31px 51px 31px;
  padding: 6px;
  text-align: center;
}
.logo { width: 60%; max-width: 60%; height: 270px; object-fit: contain; }

/* ---------- Espaço para vídeo ---------- */
.video-slot { margin: 24px 0 8px; }
.video-slot__inner {
  position: relative;
  aspect-ratio: 16 / 9;
  border: 2px dashed #09E80C;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9be89c;
  font-size: 14px;
  background: rgba(9,232,12,.05);
}
.video-slot iframe, .video-slot video {
  width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 16px; display: block;
}

/* ---------- Scroll to top ---------- */
.scroll-top {
  position: fixed;
  right: 20px; bottom: 30px;
  z-index: 99;
  display: none;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border-radius: 4px;
  background: rgba(0,0,0,.7);
  cursor: pointer;
}
.scroll-top.is-visible { display: flex; }
.scroll-top svg { width: 16px; height: 10px; fill: #09E80C; transform: rotate(180deg); }

/* ---------- Responsivo ---------- */
@media (max-width: 1024px) {
  .container { max-width: 1024px; }
}

@media (max-width: 767px) {
  .container { max-width: 767px; }
  .col--text, .col--image { width: 100%; }

  .section--top { padding: 0 0 30px 0; }
  .spacer-50 { height: 10px; }
  .spacer-40 { height: 0; }

  .hero-title { text-align: center; font-size: 36px; line-height: 1.25; overflow-wrap: anywhere; }
  .hero-text { text-align: left; margin-bottom: 40px; font-size: 17px; }

  .btn-wrap { margin: -21px 0 20px 0; padding: 0 16px; text-align: center; }
  .btn {
    display: block; width: 100%; max-width: 430px; margin: 0 auto;
    font-size: 14px; padding: 20px 10px; min-height: 56px;
  }

  .logo { width: 62%; max-width: 74%; height: 181px; }

  .section--bottom { margin-top: -42px; padding: 25px; }
  .container--narrow { max-width: 500px; }
}

@media (max-width: 480px) {
  .hero-title { font-size: 30px; }
  .hero-text { font-size: 16px; }
  .btn { font-size: 13px; padding: 16px 10px; }
  .logo { width: 78%; height: 160px; }
  .logo-wrap { margin: 10px 10px 30px; }
  .section--top { padding: 0 0 20px 0; }
}
