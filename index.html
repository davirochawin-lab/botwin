<style id="botwin-styles">/* Bot Win — estilos compartilhados pelo site e pela exportação estática. */

:root {
  --landing-background: oklch(0 0 0);
  --landing-foreground: oklch(1 0 0);
  --landing-edge: oklch(0.51 0.14 141);
  --landing-accent: oklch(0.84 0.28 142);
  --landing-button: oklch(0.81 0.27 142);
  --landing-button-hover: oklch(0.87 0.29 142);
  --landing-glow: oklch(0.87 0.29 142);
  --landing-soft: oklch(0.86 0.12 144);
  --landing-shadow: oklch(0 0 0 / 30%);
  --landing-overlay: oklch(0 0 0 / 70%);
  --landing-tint: oklch(0.81 0.27 142 / 5%);
}

*, *::before, *::after { box-sizing: border-box; }

html { font-size: 100%; -webkit-text-size-adjust: 100%; min-height: 100%; background: var(--landing-background); }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  background-color: var(--landing-background);
  color: var(--landing-foreground);
  font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.65;
  overflow-x: hidden;
}

img { max-width: 100%; height: auto; border: 0; display: inline-block; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.emoji {
  display: inline !important;
  height: 1em; width: 1em;
  margin: 0 .07em;
  vertical-align: -0.1em;
  background: none;
}

/* ---------- Layout ---------- */
.container {
  width: 100%;
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
}
.container--narrow { max-width: 525px; }

.section--top > .container { max-width: 1600px; }

.section--top {
  background-image: linear-gradient(180deg, var(--landing-edge) 7%, var(--landing-background) 77%);
  padding: 40px;
}

.section--main { background-color: var(--landing-background); }

.section--bottom {
  background-image: linear-gradient(180deg, var(--landing-background) 49%, var(--landing-edge) 84%);
  padding: 82px;
  margin: 0;
}

.main-grid { align-items: flex-start; }

.col { min-height: 1px; min-width: 0; display: flex; flex-direction: column; }
.col--text  { width: 48.034%; padding: 0 10px; }
.col--image { width: 51.919%; padding: 0 10px; background-color: var(--landing-background); }

.hero-title, .hero-text, .spacer, .logo-wrap { margin-bottom: 20px; }

.spacer { width: 100%; }
.spacer-50 { height: 50px; }
.spacer-40 { height: 40px; }
.spacer-10 { height: 10px; }

/* ---------- Conteúdo ---------- */
.hero-title {
  margin: 0 0 20px;
  text-align: start;
  font-family: "Boogaloo", Sans-serif;
  font-size: 40px;
  font-weight: 700;
  line-height: 1.3em;
  color: var(--landing-foreground);
}
.hero-title__accent { color: var(--landing-accent); }

.hero-text {
  font-family: "Roboto", Sans-serif;
  font-weight: 500;
  color: var(--landing-foreground);
}
.hero-text p { margin: 0; }

.btn-wrap {
  text-align: left;
  margin: 0 0 20px;
  padding: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 430px;
  min-height: 56px;
  text-decoration: none;
  background-color: var(--landing-button);
  color: var(--landing-background);
  fill: var(--landing-background);
  font-family: "Poppins", Sans-serif;
  font-size: 16px;
  font-weight: 900;
  line-height: 19px;
  letter-spacing: 0px;
  word-spacing: 2px;
  text-align: center;
  text-shadow: 0 0 10px var(--landing-shadow);
  box-shadow: 0 0 10px 0 var(--landing-glow);
  border-radius: 16px;
  padding: 18px 16px;
  transition: background-color .3s, transform .2s;
}
.btn:hover { background-color: var(--landing-button-hover); }
.btn:active { transform: scale(.98); }

/* Animação "shake" (Elementor) */
.animated { animation-duration: 1.25s; animation-fill-mode: both; }
.shake { animation-name: shake; animation-iteration-count: 1; }
@keyframes shake {
  from, to { transform: translate3d(0,0,0); }
  10%, 30%, 50%, 70%, 90% { transform: translate3d(-10px,0,0); }
  20%, 40%, 60%, 80% { transform: translate3d(10px,0,0); }
}
@media (prefers-reduced-motion: reduce) {
  .animated { animation: none; }
}

.logo-wrap {
  margin: 31px 31px 51px 31px;
  padding: 6px;
  text-align: center;
}
.logo { width: 60%; max-width: 60%; height: 270px; object-fit: contain; border-radius: 50%; }

/* ---------- Espaço para vídeo ---------- */
.video-slot { margin: 24px 0 8px; }
.video-slot__inner {
  position: relative;
  aspect-ratio: 16 / 9;
  border: 2px dashed var(--landing-button);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--landing-soft);
  font-size: 14px;
  background: var(--landing-tint);
}
.video-slot iframe, .video-slot video {
  width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 16px; display: block;
}

/* ---------- Scroll to top ---------- */
.scroll-top {
  position: fixed;
  right: 20px; bottom: 30px;
  z-index: 99;
  display: none;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border-radius: 4px;
  background: var(--landing-overlay);
  cursor: pointer;
}
.scroll-top.is-visible { display: flex; }
.scroll-top svg { width: 16px; height: 10px; fill: var(--landing-button); transform: rotate(180deg); }

/* ---------- Responsivo ---------- */
@media (max-width: 1024px) {
  .container { max-width: 600px; }
  .main-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
  .col--text, .col--image { width: 100%; }
  .col--text { padding: 0 24px; }
  .section--top { padding: 16px 0; }
  .spacer { display: none; }
  .hero-title { text-align: center; font-size: 38px; line-height: 1.25; margin: 12px 0 32px; }
  .hero-text { text-align: left; margin-bottom: 28px; font-size: 15px; line-height: 1.5; overflow-wrap: break-word; }
  .hero-text p > span { display: block; margin-bottom: 3px; }
  .hero-text br { display: none; }
  .btn-wrap { margin: 18px 0 20px; padding: 0; text-align: center; }
  .btn { margin: 0 auto; font-size: 14px; line-height: 1.4; padding: 18px 12px; min-height: 60px; }
  .logo-wrap { margin: 8px auto 16px; padding: 0; width: 180px; height: 180px; }
  .logo { width: 100%; max-width: 100%; height: 100%; aspect-ratio: 1; }
  .section--bottom { margin: 0; padding: 20px 0; }
  .container--narrow { max-width: 500px; }
}

@media (max-width: 480px) {
  .col--text { padding: 0 20px; }
  .hero-title { font-size: 34px; }
  .logo-wrap { width: 160px; height: 160px; }
}
